[book]
title = "Pelorus Specification Library"
description = "Pelorus Core and Pelorus Stream — readable draft specifications"
authors = ["Pelorus Marine contributors"]
language = "en"
src = "src/generated"
create-missing = false

[output.html]
default-theme = "navy"
git-repository-url = "https://github.com/pelorus-marine/specifications"
no-section-label = true

[output.html.fold]
enable = true
level = 1

[output.html.search]
limit-results = 50
use-boolean-and = true
boost-title = 10
boost-hierarchy = 8
boost-paragraph = 2
expand = true
heading-split-level = 4
