# crate-ci/typos — https://github.com/crate-ci/typos
# Run locally: install `typos` from releases or `cargo install typos-cli`

[files]
extend-exclude = [
  "book/book/**",
  "book/src/generated/**",
]

[default.extend-identifiers]
# CBOR / IETF
COSE = "COSE"
COSE_Sign1 = "COSE_Sign1"
# Spec prose uses plural forms / stylized words
NAMEs = "NAMEs"
IDentifiers = "IDentifiers"

[default]
# Acronyms where a short substring (`PN`, `ND`) is flagged inside the token.
extend-ignore-re = [
  "(?i)\\bPNCs?\\b",
  "(?i)\\bNDAs?\\b",
]

[default.extend-words]
# Power management: Partial Network Clusters (automotive / Pelorus §04)
PNCs = "PNCs"
# Non-disclosure agreements (substring `ND` in `NDAs`)
NDAs = "NDAs"
