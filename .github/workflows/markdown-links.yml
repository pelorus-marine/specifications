name: Markdown links

on:
  push:
    branches: [main, master]
    paths:
      - "**.md"
      - ".github/workflows/markdown-links.yml"
      - ".markdown-link-check.json"
  pull_request:
    branches: [main, master]
    paths:
      - "**.md"
      - ".github/workflows/markdown-links.yml"
      - ".markdown-link-check.json"

jobs:
  markdown-link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Generated mdBook sources under book/ duplicate core/stream specs with adjusted paths;
      # relative links to repo-root files (LICENSE.md, ARCHITECTURE.md) fail link-check from there.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check Markdown links
        run: |
          set -euo pipefail
          mapfile -d '' mdfiles < <(find . -name '*.md' -not -path './.git/*' -not -path './book/*' -print0)
          if [ "${#mdfiles[@]}" -eq 0 ]; then
            echo 'No Markdown files found.'
            exit 0
          fi
          npx --yes markdown-link-check@3 -q -c .markdown-link-check.json "${mdfiles[@]}"
