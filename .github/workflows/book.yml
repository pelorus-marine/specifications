name: Specification book

on:
  push:
    branches: [main, master]
    paths:
      - "book/**"
      - "core/**"
      - "stream/**"
      - "crates/**"
      - "xtask/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".rustfmt.toml"
      - ".github/workflows/book.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "book/**"
      - "core/**"
      - "stream/**"
      - "crates/**"
      - "xtask/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".rustfmt.toml"
      - ".github/workflows/book.yml"

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.90.0"

jobs:
  mdbook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pin toolchain and ship rustfmt/clippy — rust-toolchain.toml alone can sync a minimal profile.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy

      # Belt-and-suspenders: some runners still invoke `cargo` without rustfmt on the active toolchain.
      - name: Ensure rustfmt and clippy
        run: rustup component add --toolchain "${{ env.RUST_TOOLCHAIN }}" rustfmt clippy

      - uses: taiki-e/install-action@v2
        with:
          tool: mdbook@0.4.48

      - name: Rust fmt / clippy / test
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --locked --all-targets -- -D warnings
          cargo test --workspace --locked

      - name: Build workspace + mdBook
        run: cargo run --locked -p xtask -- book-build

      - name: Upload HTML artifact
        uses: actions/upload-artifact@v4
        with:
          name: pelorus-spec-book-html
          path: book/book/
